worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ---------- L0 接入层缓存 ----------
    # proxy_cache_path 指令必须放在 http 段，keys_zone 定义共享内存区名称与大小
    proxy_cache_path /var/cache/nginx/cache levels=1:2 keys_zone=content_cache:50m
                     max_size=1g
                     inactive=10m
                     use_temp_path=off;

    # keys_zone 大小 = 条目数 × 每条目约 8KB，
    # 1 个 zone 约可存 6400 个 8KB 的条目
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m
                     max_size=200m
                     inactive=30m
                     use_temp_path=off;

    log_format cache '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent cache=$upstream_cache_status '
                     'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log cache;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types application/json text/plain;

    upstream cache_backend {
        # least_conn 比轮询更适合长连接场景的缓存服务
        least_conn;
        server cache-app-1:8080 max_fails=3 fail_timeout=30s;
        server cache-app-2:8080 max_fails=3 fail_timeout=30s;
        # Nginx 不做健康检查之外的主动摘除，max_fails/fail_timeout 负责故障转移
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;

        # ---------- 命中/未命中观测 ----------
        # $upstream_cache_status 取值：
        #   HIT          命中接入层缓存，未回源
        #   MISS         未命中，已回源并缓存
        #   EXPIRED      缓存已过期
        #   BYPASS       走了 add_header 的 no-cache 路径
        #   UPDATING     缓存正在更新，被阻塞
        #   STALE        缓存过期但仍在用陈旧数据（配合 proxy_cache_use_stale）
        add_header X-Cache-Status $upstream_cache_status always;

        location /cache/product/ {
            # 关键：只有 GET/HEAD 会被缓存，写方法天然绕开接入层缓存
            proxy_pass http://cache_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_cache content_cache;
            # 查询参数不同视为不同缓存条目
            proxy_cache_key "$scheme$request_method$host$request_uri";
            # 缓存 200/301/302，避免把 5xx 也缓存住导致错误被放大
            proxy_cache_valid 200 301 302 10m;
            # 后端返回的 Cache-Control 优先
            proxy_cache_revalidate on;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            # 后端宕机时，最多再用 10 分钟的陈旧数据兜底
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            # 显式绕过缓存的调试入口：curl 带 no-cache 头即可直达应用
            proxy_cache_bypass $http_no_cache;
            proxy_no_cache $http_no_cache;

            # 关键指令：将缓存状态添加到响应头中
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # 静态资源单独用一个 zone，避免和业务接口互相挤占内存
        location /cache/static/ {
            proxy_pass http://cache_backend;
            proxy_cache static_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 1h;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location / {
            proxy_pass http://cache_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}